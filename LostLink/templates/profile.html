{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-0">
            <div class="card-header bg-white py-3">
                <h4 class="mb-0">My Profile</h4>
            </div>
            <div class="card-body p-4">
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label text-muted small fw-bold">Full Name</label>
                        <input type="text" name="name" class="form-control" value="{{ user.name }}" required>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Email Address</label>
                        <input type="email" class="form-control bg-light" value="{{ user.email }}" disabled>
                        <div class="form-text">Email cannot be changed.</div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label text-muted small fw-bold">Member Since</label>
                        <input type="text" class="form-control bg-light" value="{{ user.created_at.strftime('%Y-%m-%d') }}" disabled>
                    </div>
                    <button type="submit" class="btn btn-primary">Update Profile</button>
                </form>
                
                <hr class="my-4">
                
                <h5 class="mb-3">Account Statistics</h5>
                <ul class="list-group list-group-flush">
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Items Lost
                        <span class="badge bg-danger rounded-pill">{{ stats.lost }}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Items Found
                        <span class="badge bg-success rounded-pill">{{ stats.found }}</span>
                    </li>
                    <li class="list-group-item d-flex justify-content-between align-items-center px-0">
                        Items Recovered
                        <span class="badge bg-info rounded-pill">{{ stats.recovered }}</span>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
