{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Manage Users</h2>
<div class="card shadow-sm"><div class="card-body">
    <table class="table table-hover">
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th>Created At</th></tr></thead>
        <tbody>
        {% for u in users %}
            <tr><td>{{ u.name }}</td><td>{{ u.email }}</td><td><span class="badge bg-{{ 'primary' if u.role == 'admin' else 'secondary' }}">{{ u.role }}</span></td><td>{{ u.created_at.strftime('%Y-%m-%d') }}</td></tr>
        {% endfor %}
        </tbody>
    </table>
</div></div>
{% endblock %}
