{% extends "base.html" %}
{% block content %}
<h2 class="mb-4">Manage Items</h2>
<div class="card shadow-sm"><div class="card-body">
    <table class="table table-hover">
        <thead><tr><th>Type</th><th>Name</th><th>Category</th><th>Status</th><th>Date</th><th>Action</th></tr></thead>
        <tbody>
        {% for i in items %}
            <tr>
                <td><span class="badge bg-{{ 'danger' if i.type == 'lost' else 'success' }}">{{ i.type }}</span></td>
                <td>{{ i.item_name }}</td><td>{{ i.category }}</td>
                <td><span class="badge bg-secondary">{{ i.status }}</span></td>
                <td>{{ i.date }}</td>
                <td>
                    <a href="{{ url_for('items.item_details', item_id=i._id) }}" class="btn btn-sm btn-info">View</a>
                    <a href="{{ url_for('admin.delete_item', item_id=i._id) }}" class="btn btn-sm btn-danger" onclick="return confirm('Are you sure?')">Delete</a>
                </td>
            </tr>
        {% endfor %}
        </tbody>
    </table>
</div></div>
{% endblock %}
